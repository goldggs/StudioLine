[package]
name = "studioline"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
axum = { version = "0.8", features = ["json", "ws"] }
caseless = "0.2"
directories = "6"
futures-util = "0.3"
subtle = "2"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tempfile = "3"
fs2 = "0.4"
include_dir = "0.7"
mime_guess = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]

windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Foundation", "Win32_System_Registry", "Win32_Security"] }

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tokio-tungstenite = "0.29"
http-body-util = "0.1"
